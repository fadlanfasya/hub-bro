# nginx reverse proxy for Hub-Bro.
#
# Running nginx in Docker (docker-compose.nginx.yml)  -> upstream is hubbro:8000
# Running nginx on the host                           -> change it to 127.0.0.1:8080
#                                                        and drop the container's
#                                                        published port
upstream hubbro {
    server hubbro:8000;
}

# Plain HTTP: serve the ACME challenge, send everything else to HTTPS.
server {
    listen 80;
    server_name dashboards.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name dashboards.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # CSV uploads go through this proxy. nginx defaults to 1 MB, which rejects
    # anything bigger with a 413 before the app ever sees it.
    client_max_body_size 64m;

    # A GLPI or SQL query can take a while. Keep this above the app's own
    # FETCH_TIMEOUT_SECONDS or nginx gives up first and returns 504.
    proxy_read_timeout    120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://hubbro;
        proxy_http_version 1.1;

        # The app runs with --proxy-headers and TRUST_PROXY=true, so these are
        # what make redirects and logged client IPs correct.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # Hashed asset filenames change on every build, so they're safe to cache hard.
    location /assets/ {
        proxy_pass http://hubbro;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health endpoint for an external monitor; no need to log it.
    location = /api/health {
        proxy_pass http://hubbro;
        proxy_set_header Host $host;
        access_log off;
    }
}
