name: CI

# Tests run on every push and pull request. Releasing is a separate, manual
# decision — see release.yml. Splitting them means a red test is visible
# immediately without anything reaching the ops wall by accident.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install sqlglot

      - name: Run the Python suites
        working-directory: backend
        # A fixed key so encrypted-credential tests are reproducible. This is a
        # throwaway CI value and never touches a real deployment.
        env:
          SECRET_KEY: ci-test-secret-key-not-used-anywhere-real
        run: |
          failed=0
          for suite in tests/test_*.py; do
            case "$suite" in
              */mock_glpi.py) continue ;;
            esac
            echo "::group::$suite"
            python "$suite" || failed=1
            echo "::endgroup::"
          done
          exit $failed

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Run the test suite
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        # A build failure is a real failure: the image bakes this output in, so
        # a broken build would otherwise only surface at deploy time.
        run: npm run build

  image:
    name: Image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build without pushing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
